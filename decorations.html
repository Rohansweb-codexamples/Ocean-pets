<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decorations</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><script defer src="save.js"></script></head><body><script>function draw(){let s=load(),a=s.aquariums[s.activeAquarium];main.innerHTML='<section id=tank></section><h2>Decorations for '+a.name+'</h2><div class=grid>'+unlockedDecs(s).map(d=>`<div class=card><h2>${d[1]} ${d[0]}</h2><p>Cost ${d[3]} pearls • Unlock Lv ${d[2]}</p><button class="btn primary" onclick="buy('${d[0]}',${d[3]})">Place Decoration</button></div>`).join('')+'</div>';aquarium(tank)}function buy(n,c){let s=load(),a=s.aquariums[s.activeAquarium];if(s.pearls<c)return toast('Need more pearls');s.pearls-=c;a.decorations.push(n);save(s);draw()}addEventListener('DOMContentLoaded',()=>{shell('Decorations');draw()})</script></body></html>
