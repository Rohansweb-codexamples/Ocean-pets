<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aquarium Decorations</title>
<style>
body{margin:0;padding:20px;background:linear-gradient(#064d68,#001526);color:white;font-family:Arial;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:600px;margin:auto}
.item{background:#ffffff10;border:1px solid #ffffff20;border-radius:20px;padding:25px}
button{border:0;border-radius:14px;padding:12px;background:#ff7100;color:white;font-weight:bold}
</style>
</head>
<body>

<h1>DECORATIONS</h1>
<p id="pearls"></p>

<div class="grid">
<div class="item">🌿<h3>SEA GRASS</h3><button onclick="buy('Sea Grass',5)">5 💎</button></div>
<div class="item">🪸<h3>CORAL</h3><button onclick="buy('Coral',10)">10 💎</button></div>
<div class="item">🐚<h3>SHELL</h3><button onclick="buy('Shell',15)">15 💎</button></div>
<div class="item">🪨<h3>ROCK</h3><button onclick="buy('Rock',8)">8 💎</button></div>
<div class="item">🏰<h3>SUNKEN CASTLE</h3><button onclick="buy('Castle',30)">30 💎</button></div>
<div class="item">🫧<h3>BUBBLE MACHINE</h3><button onclick="buy('Bubbles',25)">25 💎</button></div>
</div>

<script>
const KEY="OCEAN_PETS_SAVE";
let s=JSON.parse(localStorage.getItem(KEY))||{
 pearls:100,
 aquariums:[{decorations:[]}]
};

function draw(){
 document.getElementById("pearls").textContent="Pearls: "+s.pearls;
}

function buy(name,cost){
 if(s.pearls<cost){
  alert("Not enough pearls!");
  return;
 }
 s.pearls-=cost;
 let a=s.aquariums[s.activeAquarium||0];
 if(!a.decorations)a.decorations=[];
 a.decorations.push(name);
 localStorage.setItem(KEY,JSON.stringify(s));
 draw();
}

draw();
</script>
</body>
</html>
