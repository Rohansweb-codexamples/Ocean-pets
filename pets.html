<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pets</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><script defer src="save.js"></script></head><body><script>function draw(){const s=load();main.innerHTML='<div class="grid">'+s.pets.map(p=>`<div class="card"><h2>${(PETS.find(x=>x[0]==p.type)||[])[1]} ${p.name}</h2><p>${p.type} • Lv ${p.level} • Age ${Math.floor(p.age)} days</p>${['hunger','happiness','energy'].map(k=>`<label>${k}</label><div class=bar><i style="width:${p[k]}%"></i></div>`).join('')}<input value="${p.name}" onchange="let s=load();s.pets.find(x=>x.id=='${p.id}').name=this.value;save(s);draw()"><div class=row>${Object.entries(FOODS).map(([n,f])=>`<button class="btn" onclick="feed('${p.id}','${n}')">${f.icon} ${n} ${f.cost}</button>`).join('')}</div></div>`).join('')+'</div><h2>Unlocked Pets</h2><div class=grid>'+unlockedPets(s).map(p=>`<button class="btn primary" onclick="adopt('${p[0]}')">${p[1]} Adopt ${p[0]} (50)</button>`).join('')+'</div>'}function feed(id,n){const s=load(),p=s.pets.find(x=>x.id==id),f=FOODS[n];if(s.pearls<f.cost)return toast('Need more pearls');s.pearls-=f.cost;p.hunger=Math.min(100,p.hunger+f.hunger);p.happiness=Math.min(100,p.happiness+f.happiness);p.energy=Math.min(100,p.energy+f.energy);p.xp+=10;if(p.xp>=p.level*60){p.xp=0;p.level++}save(s);draw()}function adopt(t){const s=load();if(s.pearls<50)return toast('Need 50 pearls');s.pearls-=50;s.pets.push(pet(t,t));save(s);draw()}addEventListener('DOMContentLoaded',()=>{shell('Pets');draw()})</script></body></html>
