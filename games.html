<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Games</title><link rel="stylesheet" href="style.css"><script defer src="save.js"></script></head><body><script>addEventListener('DOMContentLoaded',()=>{shell('Mini Games');let s=load();main.innerHTML='<div class=grid>'+[['Turtle Maze','turtle-maze.html','🐢'],['Pearl Rush','pearl-rush.html','🦪'],['Bubble Pop','bubble-pop.html','🫧'],['Fish Catch','fish-catch.html','🐟'],['Reef Rescue','reef-rescue.html','🪸']].map(g=>`<a class=card href=${g[1]}><h2>${g[2]} ${g[0]}</h2><p>Best score: ${s.scores[g[0]]||0}</p><button class="btn primary">Play</button></a>`).join('')+'</div>'})</script></body></html>
