<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turtle Maze</title><link rel="stylesheet" href="style.css"><script defer src="save.js"></script></head><body><script>
let score=0,time=45,hero={x:45,y:70};function draw(){shell('Turtle Maze');main.innerHTML='<div class="row"><span class=pill>Score <b id=sc>0</b></span><span class=pill>Time <b id=tm>45</b></span><button class="btn gold" onclick="start()">Restart</button></div><div id=arena class=game><span id=player class=sprite style="font-size:42px">Turtle</span></div><p class=muted>Drag or tap in the arena. Complete objectives quickly for pearls and XP.</p>';start()}
function start(){score=0;time=45;arena.innerHTML='<span id=player class=sprite style="font-size:42px">Turtle</span>';move();for(let i=0;i<12;i++)spawn();clearInterval(window.timer);window.timer=setInterval(()=>{time--;tm.textContent=time;if(time<=0)end()},1000)}
function move(){hero.x=Math.max(0,Math.min(92,hero.x));hero.y=Math.max(0,Math.min(88,hero.y));document.getElementById('player').style.left=hero.x+'%';document.getElementById('player').style.top=hero.y+'%'}
function spawn(){let e=document.createElement('span');e.className='sprite';let good=true; if('maze'==='rescue'&&Math.random()<.55){e.textContent='Trash';good=false}else e.textContent='maze'==='maze'?'Star':'maze'==='bubble'?'Bubble':'maze'==='fish'?'Fish':'Pearl';e.dataset.good=good;e.style.left=Math.random()*88+'%';e.style.top=Math.random()*82+'%';e.style.fontSize=(26+Math.random()*24)+'px';e.onclick=()=>hit(e);arena.appendChild(e);if('maze'==='fish')setInterval(()=>{e.style.left=Math.random()*88+'%';e.style.top=Math.random()*82+'%'},900)}
function hit(e){score+=e.dataset.good==='true'?10:15;sc.textContent=score;e.remove();spawn();if('maze'==='maze'&&score>=120)end()}function end(){clearInterval(window.timer);let p=Math.max(10,Math.floor(score/5)),x=Math.max(15,Math.floor(score/3));award('Turtle Maze',p,x,score);setTimeout(()=>location.href='games.html',900)}
function pos(ev){let r=arena.getBoundingClientRect(),t=ev.touches?ev.touches[0]:ev;hero.x=(t.clientX-r.left)/r.width*100;hero.y=(t.clientY-r.top)/r.height*100;move();[...arena.querySelectorAll('.sprite:not(#player)')].forEach(e=>{let a=e.getBoundingClientRect(),b=document.getElementById('player').getBoundingClientRect();if(!(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom))hit(e)})}
addEventListener('DOMContentLoaded',draw);addEventListener('pointermove',e=>{if(e.target.id==='arena')pos(e)});addEventListener('pointerdown',e=>{if(e.target.id==='arena')pos(e)});
</script></body></html>
