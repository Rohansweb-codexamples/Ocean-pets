<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turtle Maze</title>
<style>
body{margin:0;background:#063d38;color:white;font-family:Arial;text-align:center;padding:20px}
#maze{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:400px;margin:30px auto}
button{height:70px;border:0;border-radius:15px;background:#137c67;color:white;font-weight:bold;font-size:20px}
#result{font-size:24px}
</style>
</head>
<body>
<h1>🐢 TURTLE MAZE</h1>
<p>Find the hidden pearl!</p>
<div id="maze"></div>
<div id="result"></div>

<script>
const KEY="OCEAN_PETS_SAVE";
let s=JSON.parse(localStorage.getItem(KEY))||{pearls:0,scores:{}};
let correct=Math.floor(Math.random()*16);

for(let i=0;i<16;i++){
 let b=document.createElement("button");
 b.textContent="?";
 b.onclick=()=>{
  if(i===correct){
   s.pearls+=30;
   s.scores.maze=(s.scores.maze||0)+1;
   localStorage.setItem(KEY,JSON.stringify(s));
   document.getElementById("result").textContent="🎉 YOU FOUND IT! +30 PEARLS";
   document.querySelectorAll("button").forEach(x=>x.disabled=true);
  }else{
   b.textContent="×";
   b.style.background="#531f2c";
  }
 };
 document.getElementById("maze").appendChild(b);
}
</script>
</body>
</html>
