<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><script defer src="save.js"></script></head><body><script>function draw(){let s=load();main.innerHTML=`<div class=card><h2>Settings</h2><label><input type=checkbox ${s.settings.sound?'checked':''} onchange="set('sound',this.checked)"> Sound</label><label><input type=checkbox ${s.settings.particles?'checked':''} onchange="set('particles',this.checked)"> Particle effects</label><button class="btn danger" onclick="if(confirm('Reset Ocean Pets save?')){localStorage.removeItem(OP_KEY);location.reload()}">Reset Save</button><pre>${JSON.stringify(s,null,2)}</pre></div>`}function set(k,v){let s=load();s.settings[k]=v;save(s);draw()}addEventListener('DOMContentLoaded',()=>{shell('Settings');draw()})</script></body></html>
