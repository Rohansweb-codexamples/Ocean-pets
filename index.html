<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ocean Pets Aquarium</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial;background:#00182b;color:white}
canvas{position:fixed;inset:0}
#ui{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between}
.box{background:#021d31dd;border:1px solid #ffffff25;border-radius:18px;padding:12px;backdrop-filter:blur(10px);box-shadow:0 8px 25px #0008}
button{border:0;border-radius:15px;padding:13px;background:linear-gradient(135deg,#ffad22,#ff5b00);color:white;font-weight:bold;font-size:14px}
#info{position:absolute;top:75px;left:50%;transform:translateX(-50%);white-space:nowrap}
#actions{position:absolute;right:10px;bottom:15px;display:flex;flex-direction:column;gap:7px;pointer-events:auto}
#joy{position:absolute;bottom:18px;left:15px;width:115px;height:115px;border-radius:50%;background:#ffffff10;border:2px solid #ffffff25;pointer-events:auto}
#stick{width:55px;height:55px;position:absolute;left:28px;top:28px;border-radius:50%;background:linear-gradient(145deg,#ffd447,#ff5b00)}
</style>
</head>
<body>

<div id="ui">
 <div class="top">
  <div class="box">OCEAN PETS</div>
  <div class="box" id="stats">💎 100</div>
 </div>
 <div class="box" id="info">My Aquarium</div>

 <div id="joy"><div id="stick"></div></div>

 <div id="actions">
  <button onclick="eat()">FEED</button>
  <button onclick="location.href='pets.html'">PETS</button>
  <button onclick="location.href='aquariums.html'">AQUARIUMS</button>
  <button onclick="location.href='games.html'">MINI GAMES</button>
  <button onclick="location.href='decorations.html'">DECORATE</button>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const KEY="OCEAN_PETS_SAVE";

let save=JSON.parse(localStorage.getItem(KEY))||{
 pearls:100,
 level:1,
 xp:0,
 activeAquarium:0,
 activePet:0,
 aquariums:[
  {name:"My First Aquarium",theme:"reef",pets:["turtle1"],decorations:[]}
 ],
 pets:{
  turtle1:{type:"Turtle",name:"Shelly",hunger:100,happiness:100,energy:100}
 },
 unlocked:["Turtle"],
 scores:{}
};

function saveGame(){
 localStorage.setItem(KEY,JSON.stringify(save));
}

function getAq(){
 return save.aquariums[save.activeAquarium];
}

function getPet(){
 return save.pets[getAq().pets[save.activePet]||getAq().pets[0]];
}

let scene=new THREE.Scene();
scene.background=new THREE.Color(0x03516d);
scene.fog=new THREE.FogExp2(0x03516d,.012);

let camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
camera.position.set(0,4,14);

let renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9cf8ff,0x001020,2.5));

let sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(-10,25,10);
scene.add(sun);

let floor=new THREE.Mesh(
 new THREE.PlaneGeometry(180,180),
 new THREE.MeshStandardMaterial({color:0x185b43})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-6;
scene.add(floor);

/* TURTLE */
let pet=new THREE.Group();
scene.add(pet);

let body=new THREE.Mesh(
 new THREE.SphereGeometry(1.3,24,16),
 new THREE.MeshStandardMaterial({color:0x398053})
);
body.scale.set(1.45,.55,1);
pet.add(body);

let shell=new THREE.Mesh(
 new THREE.SphereGeometry(1.25,24,16),
 new THREE.MeshStandardMaterial({color:0x91bb4d})
);
shell.scale.set(1.1,.3,.82);
shell.position.y=.5;
pet.add(shell);

let head=new THREE.Mesh(
 new THREE.SphereGeometry(.62,20,14),
 new THREE.MeshStandardMaterial({color:0x65ba58})
);
head.position.x=1.6;
pet.add(head);

for(let z of [-.22,.22]){
 let eye=new THREE.Mesh(
  new THREE.SphereGeometry(.11,10,8),
  new THREE.MeshBasicMaterial({color:0xffffff})
 );
 eye.position.set(1.98,.3,z);
 pet.add(eye);
}

/* CORAL */
for(let i=0;i<55;i++){
 let coral=new THREE.Mesh(
  new THREE.CylinderGeometry(.05,.17,1+Math.random()*2,7),
  new THREE.MeshStandardMaterial({
   color:[0xff6348,0xffa52d,0xb65ee5,0x21c8ca][i%4]
  })
 );
 coral.position.set(
  (Math.random()-.5)*90,
  -5,
  (Math.random()-.5)*80
 );
 coral.rotation.z=(Math.random()-.5)*.4;
 scene.add(coral);
}

/* PEARLS */
let pearls=[];

for(let i=0;i<80;i++){
 let p=new THREE.Mesh(
  new THREE.SphereGeometry(.25,12,10),
  new THREE.MeshStandardMaterial({
   color:0xffffff,
   emissive:0xa847cc,
   emissiveIntensity:1.5
  })
 );
 p.position.set(
  (Math.random()-.5)*80,
  -3+Math.random()*17,
  (Math.random()-.5)*70
 );
 scene.add(p);
 pearls.push(p);
}

/* FISH */
let fish=[];

for(let i=0;i<40;i++){
 let f=new THREE.Mesh(
  new THREE.SphereGeometry(.2,10,8),
  new THREE.MeshStandardMaterial({
   color:[0xffbd3b,0x39d8ed,0xff6678,0xaaff52][i%4]
  })
 );
 f.position.set(
  (Math.random()-.5)*85,
  Math.random()*15-2,
  (Math.random()-.5)*75
 );
 scene.add(f);
 fish.push({m:f,s:.5+Math.random(),p:Math.random()*10});
}

/* BUBBLES */
for(let i=0;i<100;i++){
 let b=new THREE.Mesh(
  new THREE.SphereGeometry(.04+Math.random()*.07,7,7),
  new THREE.MeshBasicMaterial({color:0xb8faff,transparent:true,opacity:.4})
 );
 b.position.set(
  (Math.random()-.5)*100,
  Math.random()*25-5,
  (Math.random()-.5)*80
 );
 scene.add(b);
}

function update(){
 document.getElementById("stats").textContent="💎 "+save.pearls;
 document.getElementById("info").textContent=
  getAq().name+" · "+getPet().name+" the "+getPet().type;
}
update();

function eat(){
 let p=getPet();
 if(save.pearls<5)return;
 save.pearls-=5;
 p.hunger=Math.min(100,p.hunger+30);
 p.happiness=Math.min(100,p.happiness+10);
 save.xp+=5;
 saveGame();
 update();
}

let vx=0,vz=0,joyX=0,joyY=0;
let joy=document.getElementById("joy");
let stick=document.getElementById("stick");

function moveJoy(e){
 let r=joy.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 let max=30,d=Math.hypot(x,y);
 if(d>max){x=x/d*max;y=y/d*max}
 joyX=x/max;
 joyY=y/max;
 stick.style.transform=`translate(${x}px,${y}px)`;
}

joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);moveJoy(e)};
joy.onpointermove=moveJoy;
joy.onpointerup=joy.onpointercancel=()=>{
 joyX=joyY=0;
 stick.style.transform="translate(0,0)";
};

let last=performance.now(),time=0;

function animate(now){
 requestAnimationFrame(animate);
 let dt=Math.min(.04,(now-last)/1000);
 last=now;
 time+=dt;

 vx+=joyX*4*dt;
 vz+=joyY*4*dt;
 vx*=.92;
 vz*=.92;

 pet.position.x+=vx*dt;
 pet.position.z+=vz*dt;

 pet.position.x=Math.max(-42,Math.min(42,pet.position.x));
 pet.position.z=Math.max(-40,Math.min(40,pet.position.z));

 if(Math.abs(vx)+Math.abs(vz)>.03)
  pet.rotation.y=Math.atan2(vx,-vz);

 pet.rotation.z=Math.sin(time*4)*.03;

 fish.forEach(f=>{
  f.m.position.x+=Math.sin(time+f.p)*dt*f.s*2;
  f.m.position.z+=Math.cos(time+f.p)*dt*f.s*2;
 });

 pearls.forEach(p=>{
  if(!p.visible)return;
  p.rotation.y+=dt*2;
  if(p.position.distanceTo(pet.position)<2.4){
   p.visible=false;
   save.pearls++;
   save.xp++;
   saveGame();
   update();
  }
 });

 camera.position.lerp(
  new THREE.Vector3(pet.position.x,pet.position.y+5,pet.position.z+14),
  .06
 );
 camera.lookAt(pet.position.x,pet.position.y,pet.position.z);

 renderer.render(scene,camera);
}

animate(performance.now());

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

setInterval(saveGame,10000);
</script>
</body>
</html>
