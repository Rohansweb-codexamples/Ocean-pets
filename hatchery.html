<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hatchery</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><script defer src="save.js"></script></head><body><script>function hatch(kind,cost,min){let s=load();if(s.pearls<cost)return toast('Need more pearls');s.pearls-=cost;let pool=unlockedPets(s).filter(p=>p[2]>=min);if(!pool.length)pool=unlockedPets(s);let p=pool[Math.floor(Math.random()*pool.length)];s.pets.push(pet(p[0],p[0]+' '+(s.pets.length+1)));xp(s,30+min*5);save(s);toast('Hatched '+p[0]);draw()}function draw(){main.innerHTML='<div class=grid>'+[['Common Egg','Common',60,1],['Rare Egg','Rare',160,5],['Legendary Egg','Legendary',360,10]].map(e=>`<div class=card><h2>${e[1]} ${e[0]}</h2><p>Hatch a surprise pet. Cost ${e[2]} pearls.</p><button class="btn primary" onclick="hatch('${e[0]}',${e[2]},${e[3]})">Hatch</button></div>`).join('')+'</div>'}addEventListener('DOMContentLoaded',()=>{shell('Hatchery');draw()})</script></body></html>
