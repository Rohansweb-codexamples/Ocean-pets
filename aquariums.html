<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aquariums</title><link rel="stylesheet" href="style.css"><script defer src="save.js"></script></head><body><script>function draw(){let s=load();main.innerHTML='<button class="btn primary" onclick="addAq()">+ New Aquarium</button><div class=grid>'+s.aquariums.map((a,i)=>`<div class=card><h2>${i==s.activeAquarium?'✅ ':''}${a.name}</h2><p>${a.theme}</p><label>Name</label><input value="${a.name}" onchange="chg(${i},'name',this.value)"><label>Theme</label><select onchange="chg(${i},'theme',this.value)">${THEMES.map(t=>`<option ${a.theme==t?'selected':''}>${t}</option>`)}</select><button class="btn gold" onclick="active(${i})">Make Active</button></div>`).join('')+'</div>'}function addAq(){let s=load();s.aquariums.push({id:id(),name:'New Aquarium',theme:THEMES[s.aquariums.length%THEMES.length],decorations:[]});save(s);draw()}function chg(i,k,v){let s=load();s.aquariums[i][k]=v;save(s)}function active(i){let s=load();s.activeAquarium=i;save(s);draw()}addEventListener('DOMContentLoaded',()=>{shell('Aquariums');draw()})</script></body></html>
