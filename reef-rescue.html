<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reef Rescue</title>
<style>
body{margin:0;background:linear-gradient(#00829d,#002038);color:white;font-family:Arial;text-align:center;padding:20px}
#reef{max-width:500px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{height:100px;border-radius:20px;background:#ffffff10;border:1px solid #ffffff20;font-size:40px;display:flex;align-items:center;justify-content:center}
button{border:0;border-radius:15px;padding:14px;background:#ff7100;color:white;font-weight:bold}
</style>
</head>
<body>
<h1>REEF RESCUE</h1>
<p>Rescue all the trapped sea creatures!</p>
<div id="reef"></div>
<h2 id="result"></h2>

<script>
const KEY="OCEAN_PETS_SAVE";
let s=JSON.parse(localStorage.getItem(KEY))||{pearls:0};
let rescued=0;

for(let i=0;i<12;i++){
 let x=document.createElement("div");
 x.className="item";
 x.textContent=Math.random()<.5?"🦀":"🗑️";
 x.onclick=()=>{
  if(x.textContent==="🗑️"){
   x.textContent="🌊";
   rescued++;
  }else{
   x.textContent="🐠";
   rescued++;
  }

  if(rescued>=12){
   s.pearls+=50;
   localStorage.setItem(KEY,JSON.stringify(s));
   document.getElementById("result").textContent="REEF SAVED! +50 PEARLS";
  }
 };
 document.getElementById("reef").appendChild(x);
}
</script>
</body>
</html>
